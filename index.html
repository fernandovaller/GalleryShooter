/* ============================================================
   GALLERY SHOOTER — single-file Phaser 3 game
   ============================================================ */

const BASE_W = 1024, BASE_H = 576;
const MAX_ROUNDS = 999;
/* seeded RNG so procedural scenery is stable across reloads */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const CLIP_SIZE = 30;
const RELOAD_MS = 1000;

// items available per tier (common/rare/epic)
const ITEM_POOL = ['med','ammo','shield','slow','freeze','lifesteal','radar','nade','berserker','doublepts'];
/* round difficulty scale: weights per type, hp multiplier, visibility multiplier, speed multiplier */
function getRoundScale(r){
  const clamp=v=>Math.max(0,v);
  const t=Math.min(1,(r-1)/20); // 0 -> 1 across first 20 rounds, then plateau
  return {
    hpMult: 1+t*0.6,          // hp up to 1.6x
    visMult: 1-t*0.25,        // visibility slightly shorter
    speedMult: 1+t*0.3,       // bomber charges faster as rounds rise
    ghostBlink: 1400-t*300,   // wraith blinks a bit faster
    spawnInterval: Math.max(550,1200-r*55), // gentler spawn cadence
    maxConcurrent: Math.min(4,2+Math.floor(r/3)), // hard cap at 4 monsters on screen
    weights: {
      undead:  clamp(1.0-t*0.4),
      spitter: clamp(t<0.25?0:(t-0.25)*1.0),
      brute:   clamp(t<0.50?0:(t-0.50)*0.9),
      bomber:  clamp(t<0.65?0:(t-0.65)*0.9),
      wraith:  clamp(t<0.80?0:(t-0.80)*0.7),
    },
    innocentRate: 0.15+t*0.10, // villagers
    innocentsCount: Math.max(1,Math.floor(r/3)+1),
    dropChance: Math.min(0.25, 0.12 + t*0.13), // monster drop chance on kill
    // tier weights shift toward rare/epic as rounds rise
    tierWeights: {
      common: Math.max(0.30, 0.65 - t*0.35),
      rare:   0.28 + t*0.10,
      epic:   0.07 + t*0.18,
    },
  };
}
function getSpawnBounds(r){
  const t=Math.min(1,(r-1)/10); // expands over first 10 rounds
  const lerp=(a,b,t)=>a+(b-a)*t;
  return {
    enemyXMin: Math.round(lerp(230,80,t)),
    enemyXMax: Math.round(lerp(BASE_W-230,BASE_W-80,t)),
    enemyYMin: Math.round(lerp(BASE_H*0.50,BASE_H*0.40,t)),
    enemyYMax: Math.round(lerp(BASE_H*0.62,BASE_H*0.66,t)),
    enemyYSuicideMin: Math.round(lerp(BASE_H*0.62,BASE_H*0.58,t)),
    enemyYSuicideMax: BASE_H*0.72,
    itemXMin: Math.round(lerp(240,100,t)),
    itemXMax: Math.round(lerp(BASE_W-240,BASE_W-100,t)),
    itemYMin: Math.round(lerp(BASE_H*0.42,BASE_H*0.38,t)),
    itemYMax: Math.round(lerp(BASE_H*0.62,BASE_H*0.66,t)),
  };
}

/* ---------- Audio engine (Web Audio API, synthetic) ---------- */
const Audio = {
  ctx:null, master:null, ambient:null,
  init(){
    if(this.ctx) return;
    try {
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value=0.5; this.master.connect(this.ctx.destination);
    } catch(e){ /* autoplay-policy or unsupported: audio disabled, game keeps running */ }
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  noise(dur){
    const n = Math.floor(this.ctx.sampleRate*dur);
    const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer=buf; return src;
  },
  env(g,t0,a,d,peak=1){
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
  },
  shot(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, src=this.noise(0.08), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    f.type='highpass'; f.frequency.value=600; src.connect(f); f.connect(g); g.connect(this.master);
    this.env(g,t,0.001,0.08,0.9); src.start(t); src.stop(t+0.1);
  },
  hit(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(80,t+0.1);
    o.connect(g); g.connect(this.master); this.env(g,t,0.002,0.1,0.6); o.start(t); o.stop(t+0.12);
  },
  kill(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(400,t); o.frequency.exponentialRampToValueAtTime(60,t+0.2);
    o.connect(g); g.connect(this.master); this.env(g,t,0.003,0.2,0.5); o.start(t); o.stop(t+0.22);
  },
  hurt(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, src=this.noise(0.12), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=1200; src.connect(f); f.connect(g); g.connect(this.master);
    this.env(g,t,0.002,0.13,0.7); src.start(t); src.stop(t+0.15);
    const o=this.ctx.createOscillator(),g2=this.ctx.createGain();
    o.type='square';o.frequency.setValueAtTime(880,t);o.connect(g2);g2.connect(this.master);this.env(g2,t,0.002,0.12,0.3);o.start(t);o.stop(t+0.14);
  },
  innocent(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, freqs=[220,233,290,180];
    freqs.forEach((f,i)=>{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain(),tt=t+i*0.06;
      o.type='square';o.frequency.setValueAtTime(f,tt);o.connect(g);g.connect(this.master);this.env(g,tt,0.005,0.18,0.4);o.start(tt);o.stop(tt+0.2);
    });
  },
  item(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(880,t+0.12);
    o.connect(g); g.connect(this.master); this.env(g,t,0.003,0.15,0.4); o.start(t); o.stop(t+0.17);
  },
  reload(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    [0,0.18].forEach(d=>{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain(),tt=t+d;
      o.type='square';o.frequency.setValueAtTime(120,tt);o.connect(g);g.connect(this.master);this.env(g,tt,0.001,0.05,0.4);o.start(tt);o.stop(tt+0.06);
    });
  },
  startAmbient(){
    if(!this.ctx) return;
    if(this.ambient) return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();
    f.type='lowpass';f.frequency.value=400;o.type='sawtooth';o.frequency.value=55;
    o.connect(f);f.connect(g);g.connect(this.master);g.gain.value=0.06;o.start();this.ambient={o,g,f,base:0.06};
  },
  slowOn(){
    if(!this.ambient) return; this.ambient.f.frequency.value=120; this.ambient.o.frequency.value=30; this.ambient.g.gain.value=0.1;
  },
  slowOff(){
    if(!this.ambient) return; this.ambient.f.frequency.value=400; this.ambient.o.frequency.value=55; this.ambient.g.gain.value=this.ambient.base;
  },
  thunder(){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, src=this.noise(1.5), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=200; src.connect(f); f.connect(g); g.connect(this.master);
    this.env(g,t,0.05,1.4,0.5); src.start(t); src.stop(t+1.6);
  },
};

/* ============================================================
   BootScene — generate textures, start
   ============================================================ */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }
  create(){
    this.makeBackgroundTexture();
    this.makeEnemyTextures();
    this.makeItemTextures();
    this.scene.start('Menu');
  }
  makeBackgroundTexture(){
    const g = this.add.graphics();
    // sky gradient
    for(let y=0;y<BASE_H;y++){
      const t=y/BASE_H; const c=Phaser.Display.Color.Interpolate.ColorWithColor(0x0a0e1a,0x1a2238,t);
      g.fillStyle(Phaser.Display.Color.GetColor(c[0],c[1],c[2]),1); g.fillRect(0,y,BASE_W,1);
    }
    // ground
    g.fillStyle(0x11161e,1); g.fillRect(0,BASE_H*0.72,BASE_W,BASE_H*0.28);
    g.fillStyle(0x1a2230,1); g.fillRect(0,BASE_H*0.72,BASE_W,4);
    // buildings silhouettes removed for cleaner look
    /*
    const blds=[[60,180,120],[200,260,160],[300,140,100],[420,320,200],[560,200,130],[720,280,180],
      [860,160,110],[980,340,210],[1120,180,120],[1240,240,150]];
    blds.forEach(([x,h,w])=>{
      const yy=BASE_H*0.72-h;
      g.fillStyle(0x070a10,1); g.fillRect(x,yy,w,h);
      // windows
      for(let wy=yy+12;wy<yy+h-8;wy+=22){
        for(let wx=x+8;wx<x+w-8;wx+=18){
          if(Math.random()<0.35){ g.fillStyle(0xffe28a,0.6); g.fillRect(wx,wy,8,12); }
        }
      }
    });
    */
    // distant haze
    g.fillStyle(0x2a3a55,0.12); g.fillRect(0,BASE_H*0.55,BASE_W,60);
    g.generateTexture('bg',BASE_W,BASE_H); g.destroy();
  }
  makeEnemyTextures(){
    const flesh=0xe8c9a0, skin=0x9ab37a, dark=0x111111, bone=0xe8e0c8;
    const g=this.add.graphics();
    // ---- UNDEAD 40x70 : shambling corpse, grey-green flesh, outstretched arms ----
    {
      const w=40,h=70, cx=w/2;
      // legs (torn, asymmetric)
      g.fillStyle(0x3a4a32,1); g.fillRoundedRect(cx-9,h-18,7,18,2); g.fillRoundedRect(cx+2,h-16,7,16,2);
      // bare feet
      g.fillStyle(skin,1); g.fillRoundedRect(cx-10,h-6,9,6,2); g.fillRoundedRect(cx+1,h-5,9,5,2);
      // torso (ragged shirt)
      g.fillStyle(0x5a7a4a,1); g.fillRoundedRect(cx-12,h*0.34,24,26,4);
      // torn hem
      g.fillStyle(0x111111,1);
      g.fillRect(cx-12,h*0.66,3,4); g.fillRect(cx-4,h*0.67,3,3); g.fillRect(cx+5,h*0.66,3,4);
      // arms outstretched (rotting)
      g.fillStyle(skin,1); g.fillRect(cx-16,h*0.36,5,18); g.fillRect(cx+11,h*0.36,5,18);
      // clawed hands
      g.fillStyle(skin,1);
      g.fillTriangle(cx-16,h*0.55,cx-11,h*0.55,cx-20,h*0.62);
      g.fillTriangle(cx+11,h*0.55,cx+16,h*0.55,cx+20,h*0.62);
      // head (grey-green, sunken)
      g.fillStyle(0x8aa27a,1); g.fillCircle(cx,h*0.24,7);
      // jaw hanging
      g.fillStyle(0x6a7a55,1); g.fillRect(cx-5,h*0.26,10,5);
      // sunken eye sockets
      g.fillStyle(0x0a0a0a,1); g.fillCircle(cx-3,h*0.21,2); g.fillCircle(cx+3,h*0.21,2);
      // exposed teeth
      g.fillStyle(bone,1); g.fillRect(cx-4,h*0.27,3,2); g.fillRect(cx+1,h*0.27,3,2);
      g.generateTexture('enemy_undead',w,h);
    }
    g.clear();
    // ---- SPITTER 36x66 : hunched skeleton, dripping bile, hollow ribs ----
    {
      const w=36,h=66, cx=w/2;
      // legs (bone-thin)
      g.fillStyle(bone,1); g.fillRoundedRect(cx-7,h-16,4,16,2); g.fillRoundedRect(cx+3,h-16,4,16,2);
      // pelvis
      g.fillStyle(bone,1); g.fillRect(cx-6,h*0.62,12,4);
      // ribcage (vertical lines)
      g.fillStyle(0xc8c0a8,1); g.fillRect(cx-8,h*0.32,16,22);
      g.fillStyle(0x6a6455,1);
      for(let i=0;i<4;i++){ g.fillRect(cx-7,h*0.35+i*5,14,2); }
      // spine
      g.fillStyle(0xe8e0c8,1); g.fillRect(cx-1,h*0.32,2,24);
      // arms forward (spitting bile)
      g.fillStyle(bone,1); g.fillRect(cx+3,h*0.38,11,4); g.fillRect(cx+3,h*0.44,11,4);
      // skull
      g.fillStyle(0xe8e0c8,1); g.fillCircle(cx,h*0.22,7);
      // eye sockets (glowing green)
      g.fillStyle(0x0a0a0a,1); g.fillCircle(cx-3,h*0.22,2); g.fillCircle(cx+3,h*0.22,2);
      g.fillStyle(0x66ff44,1); g.fillCircle(cx-3,h*0.22,0.8); g.fillCircle(cx+3,h*0.22,0.8);
      // jagged teeth
      g.fillStyle(0x111111,1); g.fillRect(cx-4,h*0.27,8,2);
      // bile drip
      g.fillStyle(0x88cc44,0.9); g.fillCircle(cx+12,h*0.46,3);
      g.generateTexture('enemy_spitter',w,h);
    }
    g.clear();
    // ---- BRUTE 70x90 : hulking ogre, small head, massive fists, mossy hide ----
    {
      const w=70,h=90, cx=w/2;
      // legs (thick, squat)
      g.fillStyle(0x4a3a22,1); g.fillRoundedRect(cx-18,h-22,16,22,5); g.fillRoundedRect(cx+2,h-22,16,22,5);
      // big clawed feet
      g.fillStyle(0x2a1a08,1); g.fillRect(cx-19,h-6,18,6); g.fillRect(cx+1,h-6,18,6);
      // claws
      g.fillStyle(0x8a7a5a,1);
      g.fillTriangle(cx-19,h-6,cx-19,h-6,cx-22,h-2);
      g.fillTriangle(cx+19,h-6,cx+19,h-6,cx+22,h-2);
      // massive torso
      g.fillStyle(0x6a4a2a,1); g.fillRoundedRect(cx-28,h*0.28,56,44,8);
      // moss patches
      g.fillStyle(0x3a5a2a,0.6);
      g.fillCircle(cx-18,h*0.40,6); g.fillCircle(cx+20,h*0.50,5); g.fillCircle(cx-8,h*0.55,4);
      // scars / stitches
      g.lineStyle(2,0x3a2410,1); g.strokeLineShape(new Phaser.Geom.Line(cx-10,h*0.32,cx-10,h*0.50));
      // arms (huge, hanging)
      g.fillStyle(0x6a4a2a,1); g.fillRect(cx-34,h*0.30,12,34); g.fillRect(cx+22,h*0.30,12,34);
      // fists (enormous, knuckles dragging)
      g.fillStyle(0x8a6a3a,1); g.fillCircle(cx-28,h*0.80,10); g.fillCircle(cx+28,h*0.80,10);
      // small misshapen head
      g.fillStyle(0x5a3a1a,1); g.fillCircle(cx,h*0.20,8);
      // beady red eyes
      g.fillStyle(0xff2020,1); g.fillCircle(cx-3,h*0.18,1.5); g.fillCircle(cx+3,h*0.18,1.5);
      // tusks
      g.fillStyle(bone,1);
      g.fillTriangle(cx-5,h*0.25,cx-3,h*0.25,cx-6,h*0.30);
      g.fillTriangle(cx+5,h*0.25,cx+3,h*0.25,cx+6,h*0.30);
      g.generateTexture('enemy_brute',w,h);
    }
    g.clear();
    // ---- BOMBER 38x68 : bloated corpse, glowing boils, lumbers forward ----
    {
      const w=38,h=68, cx=w/2;
      // legs (stiff, lumbering)
      g.fillStyle(0x6a3a18,1); g.fillRoundedRect(cx-9,h-16,7,16,2); g.fillRoundedRect(cx+2,h-16,7,16,2);
      // torn boots
      g.fillStyle(0x3a1a08,1); g.fillRoundedRect(cx-10,h-5,9,5,2); g.fillRoundedRect(cx+1,h-5,9,5,2);
      // distended belly (orange/yellow pus)
      g.fillStyle(0xd97a1a,1); g.fillRoundedRect(cx-13,h*0.34,26,28,6);
      g.fillStyle(0xf2aa44,0.7); g.fillCircle(cx-5,h*0.46,4); g.fillCircle(cx+6,h*0.52,3);
      // glowing boils (red/yellow)
      g.fillStyle(0xcc2020,1); g.fillCircle(cx-8,h*0.40,2); g.fillCircle(cx+7,h*0.44,2);
      g.fillStyle(0xffe040,1); g.fillCircle(cx-8,h*0.40,0.8); g.fillCircle(cx+7,h*0.44,0.8);
      // reaching arms
      g.fillStyle(0x8a4a18,1); g.fillRect(cx-15,h*0.36,5,16); g.fillRect(cx+10,h*0.36,5,16);
      // clawed hands
      g.fillStyle(0x6a3a08,1);
      g.fillTriangle(cx-15,h*0.54,cx-10,h*0.54,cx-18,h*0.60);
      g.fillTriangle(cx+10,h*0.54,cx+15,h*0.54,cx+18,h*0.60);
      // head (bloated, one eye burst)
      g.fillStyle(0xb05a1a,1); g.fillCircle(cx,h*0.24,7);
      g.fillStyle(0x0a0a0a,1); g.fillCircle(cx-3,h*0.21,2);
      g.fillStyle(0xff2020,1); g.fillCircle(cx+3,h*0.21,2);
      // stitched mouth
      g.lineStyle(1,0x3a1a08,1); g.strokeLineShape(new Phaser.Geom.Line(cx-5,h*0.26,cx+5,h*0.26));
      // fuse spark on top
      g.fillStyle(0xffe040,1); g.fillCircle(cx,h*0.13,1.5);
      g.generateTexture('enemy_bomber',w,h);
    }
    g.clear();
    // ---- WRAITH 38x70 : spectral purple shroud, hollow eyes, wavy tail ----
    {
      const w=38,h=70, cx=w/2;
      // body: rounded top, wavy bottom (draw via path)
      g.fillStyle(0x9a5ad9,0.85);
      g.beginPath();
      g.moveTo(cx-13,h*0.30);
      g.arc(cx,h*0.30,13,Math.PI,0);
      g.lineTo(cx+13,h*0.80);
      // wavy bottom (3 humps)
      g.lineTo(cx+9,h*0.86); g.lineTo(cx+5,h*0.80); g.lineTo(cx,h*0.86);
      g.lineTo(cx-5,h*0.80); g.lineTo(cx-9,h*0.86); g.lineTo(cx-13,h*0.80);
      g.closePath(); g.fillPath();
      // outline
      g.lineStyle(2,0x6a3aa9,1); g.strokePath();
      // hollow eyes

/* ============================================================

   ============================================================ */
class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }
  create(){
    const W=BASE_W,H=BASE_H, groundY=H*0.72;
    const rng=mulberry32(20240729);

    // ---- animated background (sky gradient, stars, moon, rain) ----
    this.bgGfx=this.add.graphics().setDepth(0);
    // sky gradient (same 6-stop as GameScene)
    const stops=[{t:0,col:0x070512},{t:0.25,col:0x0a0e1a},{t:0.50,col:0x121a2e},{t:0.65,col:0x1a2238},{t:0.70,col:0x2a2238},{t:0.72,col:0x3a2a30}];
    for(let y=0;y<groundY+2;y++){
      const t=y/(groundY+2); let s0=stops[0],s1=stops[1];
      for(let si=0;si<stops.length-1;si++){ if(t>=stops[si].t&&t<=stops[si+1].t){ s0=stops[si]; s1=stops[si+1]; break; } }
      const lt=(t-s0.t)/(s1.t-s0.t);
      const c=Phaser.Display.Color.Interpolate.ColorWithColor(s0.col,s1.col,lt);
      this.bgGfx.fillStyle(Phaser.Display.Color.GetColor(c[0],c[1],c[2]),1); this.bgGfx.fillRect(0,y,W,1);
    }
    // ground gradient
    for(let y=0;y<H-groundY;y++){
      const t=y/(H-groundY);
      const c=Phaser.Display.Color.Interpolate.ColorWithColor(0x11161e,0x070a0e,t);
      this.bgGfx.fillStyle(Phaser.Display.Color.GetColor(c[0],c[1],c[2]),1); this.bgGfx.fillRect(0,groundY+y,W,1);
    }
    this.bgGfx.fillStyle(0x1a2230,1); this.bgGfx.fillRect(0,groundY,W,4);
    // stars
    this.menuStars=[];
    for(let i=0;i<100;i++){
      const sx=rng()*W, sy=rng()*H*0.45, sr=rng()*1.5+0.5, sa=0.3+rng()*0.5;
      this.bgGfx.fillStyle(0xffffff,sa); this.bgGfx.fillCircle(sx,sy,sr);
      this.menuStars.push({x:sx,y:sy,r:sr,baseAlpha:sa,twPhase:rng()*Math.PI*2,twSpeed:0.5+rng()*1.5});
    }
    // moon
    const moonX=W*0.78, moonY=H*0.18, moonR=42;
    const mg=this.add.graphics().setDepth(0);
    for(let r=moonR+60;r>moonR;r-=4){ const a=Math.pow((moonR+60-r)/60,2)*0.2; mg.fillStyle(0xc8d0ff,a); mg.fillCircle(moonX,moonY,r); }
    mg.fillStyle(0xd8dce8,1); mg.fillCircle(moonX,moonY,moonR);
    mg.fillStyle(0xb0b8c8,0.3); mg.fillCircle(moonX+8,moonY+6,moonR-4);
    const craters=[[-15,-8,8],[8,-12,6],[-4,10,7],[16,4,5],[-18,14,4],[2,-4,3],[12,16,5],[-8,-18,4]];
    craters.forEach(([dx,dy,cr])=>{ mg.fillStyle(0xa0a8b8,0.4); mg.fillCircle(moonX+dx,moonY+dy,cr); mg.fillStyle(0x888c9c,0.3); mg.fillCircle(moonX+dx+1,moonY+dy+1,cr-2); });

    // building silhouettes removed for cleaner look
    /*
    const blds=[[60,180,120],[200,260,160],[300,140,100],[420,320,200],[560,200,130],[720,280,180],[860,160,110],[980,340,210],[1120,180,120],[1240,240,150]];
    const bldG=this.add.graphics().setDepth(1);
    blds.forEach(([x,h,w])=>{
      const yy=groundY-h;
      bldG.fillStyle(0x070a10,1); bldG.fillRect(x,yy,w,h);
      for(let wy=yy+12;wy<yy+h-8;wy+=22){
        for(let wx=x+8;wx<x+w-8;wx+=18){
          if(rng()<0.35){ const col=rng()<0.7?0xC8A84B:0x4A7FA5; bldG.fillStyle(col,0.7); const sz=Math.floor(rng()*3); const sw=[6,9,16][sz], sh=[8,12,8][sz]; bldG.fillRect(wx,wy,sw,sh); }
        }
      }
    });
    */

    // rain (2 layers)
    this.menuRainB=this.add.graphics().setDepth(5);
    this.menuRainF=this.add.graphics().setDepth(16);
    this.menuDropsB=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,speed:6+Math.random()*3,length:8+Math.random()*4,alpha:0.08+Math.random()*0.07}));
    this.menuDropsF=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,speed:10+Math.random()*6,length:14+Math.random()*8,alpha:0.2+Math.random()*0.15}));

    // thunder schedule
    this.menuThunderNext=Phaser.Math.Between(8000,20000);

    // ---- title with breathing scale + glitch ----
    const title=this.add.text(W/2,170,'GALLERY SHOOTER',{fontFamily:'Courier New',fontSize:'72px',color:'#ff4040',fontStyle:'bold'}).setOrigin(0.5).setDepth(10);
    title.setShadow(0,0,'#600000',4,true);
    this.titleText=title;
    this.tweens.add({targets:title,scaleX:{from:1,to:1.04},scaleY:{from:1,to:1.04},duration:2500,yoyo:true,repeat:-1,ease:'Sine.inOut'});
    // glitch: random horizontal offset + red shadow flash
    this.glitchTimer=this.time.addEvent({delay:4000,loop:true,callback:()=>{
      const offsets=[-4,4,-2,2];
      const off=offsets[Math.floor(Math.random()*offsets.length)]*2;
      this.tweens.add({targets:title,x:W/2+off,duration:30,yoyo:true,repeat:2,onComplete:()=>{ title.x=W/2; }});
      title.setShadow(off,0,'#ff0000',8,true);
      this.time.delayedCall(120,()=>title.setShadow(0,0,'#600000',4,true));
    }});

    // ---- typewriter subtitle ----
    const subText='Aponte. Atire. Acerte os inimigos.';
    const sub=this.add.text(W/2,250,'',{fontSize:'22px',color:'#ccd'}).setOrigin(0.5).setDepth(10);
    this.tweens.add({targets:sub,alpha:{from:0,to:1},duration:300});
    let charIdx=0;
    this.typeTimer=this.time.addEvent({delay:45,loop:true,callback:()=>{
      charIdx++; sub.setText(subText.slice(0,charIdx));
      if(charIdx>=subText.length) this.typeTimer.remove();
    }});

    // ---- elaborated button: glow pulse + scan-line ----
    const btnY=340;
    // glow layers (3 expanding rects behind button)
    this.btnGlows=[];
    for(let i=0;i<3;i++){
      const glow=this.add.rectangle(W/2,btnY,320+i*10,70+i*6,0xff4040,0.06).setDepth(3);
      this.tweens.add({targets:glow,alpha:{from:0.04+i*0.02,to:0.14+i*0.02},duration:1500,yoyo:true,repeat:-1,delay:i*120,ease:'Sine.inOut'});
      this.btnGlows.push(glow);
    }
    const btn=this.add.rectangle(W/2,btnY,320,70,0x222a33).setStrokeStyle(3,0xff4040).setDepth(4);
    const btxt=this.add.text(W/2,btnY,'INICIAR JOGO',{fontSize:'30px',color:'#fff',fontStyle:'bold'}).setOrigin(0.5).setDepth(5);
    // scan-line effect: thin rect sweeping vertically across button
    this.scanLine=this.add.rectangle(W/2,btnY,316,3,0x88ddff,0.25).setDepth(5);
    this.tweens.add({targets:this.scanLine,y:{from:btnY-32,to:btnY+32},duration:800,repeat:-1,yoyo:false,onRepeat:()=>{ this.scanLine.y=btnY-32; }});
    // hover particles
    btn.setInteractive({useHandCursor:true});
    btn.on('pointerover',()=>{
      btn.setFillStyle(0x33404d);
      this.btnGlows.forEach(g=>g.setFillStyle(0xff6060));
    });
    btn.on('pointerout',()=>{
      btn.setFillStyle(0x222a33);
      this.btnGlows.forEach(g=>g.setFillStyle(0xff4040));
    });
    btn.on('pointerdown',()=>{ Audio.init(); Audio.resume(); Audio.startAmbient(); this.scene.start('Game'); });
    this.input.keyboard.on('keydown-SPACE',()=>{ Audio.init(); Audio.resume(); Audio.startAmbient(); this.scene.start('Game'); });

    // ---- enemy preview thumbnails ----
    const enemies=['undead','spitter','brute','bomber','wraith','villager'];
    const names=['MORTO-VIVO','CUSPIDOR','BRUTAMONTES','BOMBARDEIRO','ESPECTRO','ALDEÃO'];
    const eKeys=['enemy_undead','enemy_spitter','enemy_brute','enemy_bomber','enemy_wraith','enemy_villager'];
    const iconY=430;
    const spacing=150;
    const startX=W/2-(enemies.length-1)*spacing/2;
    enemies.forEach((type,i)=>{
      const cx=startX+i*spacing;
      // circular background
      const circ=this.add.graphics().setDepth(3);
      circ.fillStyle(0x111a22,0.6); circ.fillCircle(cx,iconY,42);
      circ.lineStyle(2,0x2a3a4a,0.6); circ.strokeCircle(cx,iconY,42);
      circ.fillStyle(0x0a0e14,0.7); circ.fillCircle(cx,iconY,38);
      // enemy image
      this.add.image(cx,iconY,eKeys[i]).setDisplaySize(44,66).setDepth(4).setScale(0.7);
      // label below
      this.add.text(cx,iconY+48,names[i],{fontSize:'11px',color:'#8899aa'}).setOrigin(0.5).setDepth(4);
    });

    // ---- help text ----
    const help=[
      '[ESPAÇO] Iniciar jogo',
      '[>] Clique esquerdo: atirar',
      '[R] Recarregar  ('+CLIP_SIZE+' balas / pente)',
      '[P] ESC / P: pausar',
      'Cuidado com os ALDEÕES — azul/amarelo, sem arma.',
    ];
    this.add.text(W/2,530,help,{fontSize:'13px',color:'#667788',align:'center',lineSpacing:2}).setOrigin(0.5).setDepth(4);

    // ---- footer: version + highscore ----
    this.add.text(12,H-14,'v1.2.0',{fontSize:'11px',color:'#445566'}).setOrigin(0,0.5).setDepth(5);
    const hs=parseInt(localStorage.getItem('gs_highscore')||'0',10);
    this.add.text(W-12,H-14,hs>0?'RECORDE: '+hs.toLocaleString():'',{fontSize:'13px',color:'#ffcc44'}).setOrigin(1,0.5).setDepth(5);

    // saved references for update()
    this.menuW=W; this.menuH=H; this.menuGroundY=groundY;
  }
  update(time,delta){
    const W=this.menuW,H=this.menuH;
    // star twinkle overlay
    if(!this.starOverlay){ this.starOverlay=this.add.graphics().setDepth(0); }
    const g=this.starOverlay; g.clear();
    const tn=time*0.001;
    this.menuStars.forEach(s=>{
      const tw=Math.sin(tn*s.twSpeed+s.twPhase)*0.3+0.7;
      const a=s.baseAlpha*tw;
      if(a>s.baseAlpha*0.5){ g.fillStyle(0xffffff,a*0.3); g.fillCircle(s.x,s.y,s.r); }
    });
    // rain
    this.updateMenuRain(this.menuRainB,this.menuDropsB);
    this.updateMenuRain(this.menuRainF,this.menuDropsF);
    // thunder
    this.menuThunderNext-=delta;
    if(this.menuThunderNext<=0){
      const flash=this.add.rectangle(W/2,H/2,W,H,0xffffff,0).setDepth(999);
      this.tweens.add({targets:flash,alpha:{from:0,to:0.5},duration:40,yoyo:true,onComplete:()=>flash.destroy()});
      this.menuThunderNext=Phaser.Math.Between(10000,25000);
    }
  }
  updateMenuRain(g,drops){
    const W=this.menuW,H=this.menuH, wind=0.25;
    g.clear();
    drops.forEach(d=>{
      d.y+=d.speed; d.x+=d.speed*wind;
      if(d.y>H){ d.y=-d.length; d.x=Phaser.Math.Between(-100,W); }
      if(d.x>W+20) d.x=-20; if(d.x<-20) d.x=W+20;
      g.lineStyle(1,0xAAAACC,d.alpha);
      g.strokeLineShape(new Phaser.Geom.Line(d.x,d.y,d.x+wind*d.length,d.y+d.length));
    });
  }
}

/* ============================================================
   Enemy classes
   ============================================================ */
class Enemy extends Phaser.GameObjects.Container {
  constructor(scene,x,y,type){
    super(scene,x,y); scene.add.existing(this);
    this.type=type; this.def=ENEMY_DEFS[type];
    const scale=scene.roundScale||getRoundScale(1);
    this.hp=(type==='brute'?2:this.def.hp); this.maxHp=this.hp;
    this.visibleTime=Phaser.Math.Between(this.def.vis[0],this.def.vis[1])*scale.visMult;
    this.born=scene.time.now; this.alive=true; this.killed=false; this.scored=false;
    this.slowFactor=1;
    const tex='enemy_'+(type==='villager'?'villager':type);
    const body=this.scene.add.image(0,0,tex);
    this.add(body); this.body=body;
    // icon removed for cleaner look
    // const icon=this.scene.add.text(0,-body.height*0.5-6,this.def.icon,{fontSize:'12px',color:'#fff',fontStyle:'bold',backgroundColor:'#000',padding:{x:3,y:1}}).setOrigin(0.5);
    // this.add(icon);
    this.setSize(body.width,body.height);
    this.setDepth(10);
    this.silUntil=0; this.flashUntil=0;
    // shadow under feet
    this.shadow=this.scene.add.ellipse(x,y+body.height/2-4,body.width,8,0x000000,0.35).setDepth(9);
    // entrance: dark silhouette warning then reveal
    this.setScale(0.2);
    if(type!=='wraith'){
      this.body.setTint(0x000000); this.alpha=0.5; this.silUntil=this.scene.time.now+300;
      this.scene.time.delayedCall(300,()=>{ if(!this.active) return;
        this.scene.tweens.add({targets:this,alpha:1,duration:100,onComplete:()=>{ if(this.body) this.body.clearTint(); }}); });
    } else { this.alpha=0; this.scene.tweens.add({targets:this,alpha:1,duration:180}); }
    this.scene.tweens.add({targets:this,scaleX:1,scaleY:1,duration:180,ease:'Back.out'});
    // cover pop: emerge from below line
    this.y=y+40; this.scene.tweens.add({targets:this,y,duration:200,ease:'Quad.out'});
  }
  preUpdate(){
    if(!this.alive) return;
    const elapsed=(this.scene.time.now-this.born)*this.slowFactor;
    if(elapsed>=this.visibleTime && !this.killed) this.escape();
  }
  takeHit(scene){
    if(!this.alive) return false;
    // berserker buff: instant kill (bypass hp)
    const berzing = scene.stats && scene.stats.berserkUntil && scene.time.now<scene.stats.berserkUntil;
    if(berzing) this.hp=0; else this.hp--;
    // lifesteal buff: heal player per hit
    if(scene.stats.lifestealShots>0){
      scene.stats.lifestealShots--;
      scene.stats.hp=Math.min(100,scene.stats.hp+5);
      scene.ui && scene.ui.refresh();
    }
    Audio.hit();
    scene.spawnBlood(this.x,this.y);
    if(this.hp<=0){ this.die(scene); return true; }
    // brute hit flash
    this.body.setTintFill(0xffffff); this.flashUntil=this.scene.time.now+80;
    this.scene.time.delayedCall(80,()=>this.body&&this.body.clearTint());
    return false;
  }
  die(scene){
    this.killed=true; this.alive=false; Audio.kill();
    scene.onEnemyKilled(this);
    this.scene.tweens.add({targets:this,scaleY:0.2,scaleX:1.3,alpha:0,angle:Phaser.Math.Between(-20,20),duration:250,onComplete:()=>this.destroy()});
  }
  escape(){
    if(this.killed) return;
    this.killed=true; this.alive=false;
    // villagers never attack the player
    if(!this.innocent) this.scene.takeDamage(this.def.dmg);
    this.scene.tweens.add({targets:this,alpha:0,duration:200,onComplete:()=>this.destroy()});
  }
  destroy(fromScene){ if(this.shadow) this.shadow.destroy(); super.destroy(fromScene); }
}
class Undead extends Enemy { constructor(s,x,y){ super(s,x,y,'undead'); } }
class Spitter extends Enemy { constructor(s,x,y){ super(s,x,y,'spitter'); } }
class Brute    extends Enemy {
  constructor(s,x,y){ super(s,x,y,'brute');
    this.barBg=s.add.rectangle(0,-this.body.height/2-12,70,6,0x000000,0.6).setOrigin(0.5);
    this.bar=s.add.rectangle(0,-this.body.height/2-12,70,6,0xff4040).setOrigin(0.5);
    this.add([this.barBg,this.bar]);
  }
  takeHit(s){ const r=super.takeHit(s); if(this.bar){ this.bar.scaleX=Math.max(0,this.hp/this.maxHp);} return r; }
}
class Bomber extends Enemy {
  constructor(s,x,y){ super(s,x,y,'bomber'); this.targetY=BASE_H/2; const sc=s.roundScale||getRoundScale(1); this.speed=Phaser.Math.Between(18,30)*sc.speedMult; }
  preUpdate(t,d){
    if(!this.alive) return;
    if(this.y>this.targetY){ this.y-=this.speed*(d/1000)*this.slowFactor; }
    super.preUpdate();
    // reached center
    if(this.y<=this.targetY && !this.killed){ this.explode(); }
  }
  explode(){ if(this.killed) return; this.killed=true; this.alive=false; this.scene.takeDamage(this.def.dmg); this.scene.spawnBlood(this.x,this.y); this.destroy(); }
}
class Wraith extends Enemy {
  constructor(s,x,y){ super(s,x,y,'wraith'); this.blink=0; this.phasable=true; const sc=s.roundScale||getRoundScale(1); this.blinkDuration=sc.ghostBlink||1400; }
  preUpdate(t,d){
    if(!this.alive) return;
    this.blink+=d*this.slowFactor;
    const phase=Math.floor(this.blink/this.blinkDuration)%2===0;
    this.alpha=phase?1:0.15; this.phasable=phase;
    super.preUpdate();
  }
  takeHit(s){ if(!this.phasable) return false; return super.takeHit(s); }
}

/* ============================================================
   PowerUp
   ============================================================ */
class PowerUp extends Phaser.GameObjects.Container {
  constructor(scene,x,y,kind){
    super(scene,x,y); scene.add.existing(this);
    this.kind=kind; this.born=scene.time.now;
    const def=ITEM_DEFS[kind]; this.life=def.life; this.tier=def.tier;
    // tier aura ring (pulsing color)
    const auraColor=def.color;
    this.aura=scene.add.graphics().setDepth(19);
    this.add(this.aura);
    // item icon
    const bg=scene.add.image(0,0,'item_'+kind).setDepth(20);
    this.add(bg); this.bg=bg;
    this.setSize(48,48); this.setDepth(20);
    this.auraPulse=0;
  }
  preUpdate(t,d){
    if(!this.scene || !this.scene.sys) return;
    const age=this.scene.time.now-this.born;
    // pulsing aura ring grows/fades with tier color
    this.auraPulse=(this.auraPulse+d/600)%1;
    const ring=this.auraPulse*Math.PI*2;
    const r=26 + Math.sin(ring)*4;
    this.aura.clear();
    this.aura.lineStyle(3, ITEM_DEFS[this.kind].color, 0.45+0.35*(0.5+0.5*Math.sin(ring)));
    this.aura.strokeCircle(0,0,r);
    // last 1.2s blink fast so player notices it's expiring
    if(age>this.life-1200) this.alpha=(Math.sin(this.scene.time.now/80)+1)/2*0.5+0.4;
    if(age>this.life){
      if(this.scene.items) this.scene.items=this.scene.items.filter(i=>i!==this);
      this.destroy();
    }
  }
  destroy(fromScene){
    if(this.aura) this.aura.destroy();
    super.destroy(fromScene);
  }
}

  drawVent(g,x,baseY){

  updateScenery(delta){
    const mx=this.input.mousePointer.x, cx=this.scale.width/2, ratio=(mx-cx)/cx;
    this.layerBack.x=ratio*-15; this.layerMid.x=ratio*-30; this.layerFront.x=ratio*-55;
    this.updateParallaxMid(ratio);
    this.updateSpotlight(delta);
    this.updateLampPosts(delta);
    this.updateStars(delta);
    const now=this.time.now;
    this.blinkers.forEach(b=>{ if(now>b.next){ b.on=!b.on; b.rect.fillColor=b.on?b.col:0x0D1117; b.rect.fillAlpha=b.on?0.85:0.4; b.next=now+Phaser.Math.Between(2000,6000); } });
    this.updateWind(delta);
    this.updateRain(this.rainBack,this.dropsBack);
    this.updateRain(this.rainFront,this.dropsFront);
    this.updateSplashes();
    this.updateSteam();
    this.updateFog(delta);
    // shadows + depth tint per enemy
    const topY=BASE_H*0.45, botY=BASE_H*0.66;
    this.enemies.forEach(e=>{
      if(!e.shadow||!e.body) return;
      e.shadow.x=e.x; e.shadow.y=e.y+e.height/2-4;
      if(e.silUntil&&now<e.silUntil) return;
      if(e.flashUntil&&now<e.flashUntil) return;
      const t=Phaser.Math.Clamp((e.y-topY)/(botY-topY),0,1);
      const c=Phaser.Display.Color.Interpolate.ColorWithColor(
        Phaser.Display.Color.ValueToColor(0xC0D0E0),
        Phaser.Display.Color.ValueToColor(0xFFFFFF),
        1, t
      );
      e.body.setTint(Phaser.Display.Color.GetColor(c.r,c.g,c.b));
    });
  }
  updateRain(g,drops){
    const W=BASE_W,H=BASE_H; g.clear();
    const wind = this.wind ? this.wind.current : 0.2;
    drops.forEach(d=>{
      d.y += d.speed;
      d.x += d.speed * wind;
      if(d.y>H){
        // create splash on front wall if front drops
        if(drops===this.dropsFront && this.splashes && this.splashes.length<30){
          this.splashes.push({x:d.x,y:BASE_H-60,r:1,maxR:4+Math.random()*4,alpha:0.5});
        }
        d.y=-d.length; d.x=Phaser.Math.Between(-100,W);
      }
      if(d.x>W+20) d.x=-20;
      if(d.x<-20) d.x=W+20;
      g.lineStyle(1,0xAAAACC,d.alpha);
      const dx = wind*d.length;
      g.strokeLineShape(new Phaser.Geom.Line(d.x,d.y,d.x+dx,d.y+d.length));
    });
  }
  updateWind(delta){
    if(!this.wind) return;
    const w=this.wind;
    w.changeTimer += delta;
    if(w.changeTimer > w.changeInterval){
      w.changeTimer = 0;
      w.target = Phaser.Math.FloatBetween(0.10,0.45);
      w.changeInterval = Phaser.Math.Between(3000,7000);
    }
    // smooth interpolation toward target
    w.current += (w.target - w.current) * 0.02;
  }
  updateSplashes(){
    if(!this.splashes) return;
    const g=this.splashG; g.clear();
    this.splashes = this.splashes.filter(s=>s.alpha>0);
    this.splashes.forEach(s=>{
      s.r += 0.4;
      s.alpha -= 0.04;
      g.lineStyle(1,0xAAAACC,s.alpha);
      g.strokeEllipse(s.x,s.y,s.r*2,s.r);
    });
  }
  updateFog(delta){
    if(!this.fogPulse) return;
    this.fogPulsePhase += delta*0.0003;
    const g=this.fogPulse;
    g.clear();
    const intensity = 0.25 + Math.sin(this.fogPulsePhase)*0.08;
    const Ww=BASE_W, gY=BASE_H*0.72;
    for(let i=0;i<45;i++){
      const t=i/45;
      const py = gY-80+t*20;
      g.fillStyle(0x0A1520, intensity*(1-t)*0.5);
      g.fillRect(0,py,Ww,22);
    }
  }
  updateSteam(){
    const g=this.steamG; g.clear();
    if(this.steamParticles.length<40 && Math.random()<0.4){ const p=this.steamPoints[Math.floor(Math.random()*2)];
      this.steamParticles.push({x:p.x,y:p.y,vx:Phaser.Math.FloatBetween(-0.3,0.3),vy:Phaser.Math.FloatBetween(0.5,1),alpha:0.3,r:Phaser.Math.Between(2,4)}); }
    this.steamParticles=this.steamParticles.filter(p=>p.alpha>0);
    this.steamParticles.forEach(p=>{ p.y-=p.vy; p.x+=p.vx; p.alpha-=0.006; g.fillStyle(0xffffff,p.alpha); g.fillCircle(p.x,p.y,p.r); });
  }
  updateSpotlight(delta){
    const W=BASE_W;
    const s=this.spotlight, g=this.spotlightG; if(!g) return;
    s.timer += delta;
    if(s.state==='off'){
      if(s.timer>s.nextTrigger){ s.state='sweeping'; s.timer=0; s.alpha=0; s.x=s.targetX<W*0.5?W*0.1:W*0.9; s.startX=s.x; s.endX=s.targetX; if(s.startX>s.endX){const t=s.startX;s.startX=s.endX;s.endX=t;} }
    } else if(s.state==='sweeping'){
      const dur=4000; const t=s.timer/dur;
      if(t>=1){ s.state='off'; s.timer=0; s.x=s.endX; s.alpha=0;
        s.targetX=Phaser.Math.FloatBetween(W*0.15,W*0.85);
        s.nextTrigger=Phaser.Math.Between(6000,14000); }
      else {
        s.x=Phaser.Math.Linear(s.startX,s.endX,t);
        s.alpha = t<0.15 ? t/0.15 : t>0.85 ? (1-t)/0.15 : 1;
        s.alpha *= 0.08;
      }
    }
    g.clear();
    if(s.alpha<=0) return;
    const sx=s.x, sy=s.y;
    const bw=s.beamWidth, bl=s.beamLen;
    const halfA=s.beamAngle;
    // draw beam as cone
    g.beginPath();
    g.moveTo(sx,sy);
    g.lineTo(sx-bw, sy+bl);
    g.lineTo(sx+bw, sy+bl);
    g.closePath();
    g.fillStyle(0xffeecc, s.alpha); g.fillPath();
    g.lineStyle(1,0xffeecc,s.alpha*0.5);
    g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx-bw,sy+bl); g.moveTo(sx,sy); g.lineTo(sx+bw,sy+bl); g.strokePath();
    // source glow
    g.fillStyle(0xffeecc, s.alpha*3); g.fillCircle(sx,sy,6);
  }
  updateStars(delta){
    if(!this.stars) return;
    const sg=this.add.graphics; // we don't clear sky graphics (static); instead update via container not feasible.
    // Twinkle handled via overlapping small graphics drawing at depth 0 alpha changes.
    // To keep it simple and fast we'll overlay a single graphics object.
    if(!this.starOverlay){
      this.starOverlay=this.add.graphics().setDepth(0);
    }
    const g=this.starOverlay; g.clear();
    const tnow=this.time.now*0.001;
    this.stars.forEach(s=>{
      const tw=Math.sin(tnow*s.twSpeed+s.twPhase)*0.3+0.7;
      const a=s.baseAlpha*tw;
      if(a>s.baseAlpha*0.5){ g.fillStyle(0xffffff,a*0.3); g.fillCircle(s.x,s.y,s.r); }
    });
  }
  drawDeadTree(g,x,baseY,maxH,seed){
    const rng=mulberry32(99991+seed*7);
    g.fillStyle(0x14181e,1); g.lineStyle(3,0x14181e,1);
    const trunkH=maxH*0.6;
    g.fillRect(x-3,baseY-trunkH,6,trunkH);
    // branches
    const drawBranch=(bx,by,angle,len,depth)=>{
      if(depth<=0||len<6) return;
      const tx2=bx+Math.cos(angle)*len, ty2=by-Math.sin(angle)*len;
      g.lineStyle(Math.max(1,depth),0x14181e,1);
      g.beginPath(); g.moveTo(bx,by); g.lineTo(tx2,ty2); g.strokePath();
      const na=angle+rng()*0.6-0.3;
      drawBranch(tx2,ty2,na+0.4,len*0.65,depth-1);
      drawBranch(tx2,ty2,na-0.5,len*0.55,depth-1);
    };
    const topY=baseY-trunkH;
    drawBranch(x,topY,0.1+rng()*0.2,maxH*0.35,4);
    drawBranch(x,topY,Math.PI-0.1-rng()*0.2,maxH*0.35,4);
  }
  updateParallaxMid(ratio){
    if(this.layerMidFar) this.layerMidFar.x=ratio*-40;
  }
  updateLampPosts(delta){
    if(!this.lampBulbs) return;
    const now=this.time.now;
    this.lampBulbs.forEach(lp=>{
      if(now>lp.flickerNext){
        lp.flickerNext=now+Phaser.Math.Between(3000,12000);
        lp.flicker=now+Phaser.Math.Between(100,500);
      }
      if(now<lp.flicker){
        lp.bulb.fillAlpha=0.3+Math.random()*0.4;
      } else {
        lp.bulb.fillAlpha=0.85;
      }
    });
  }
  triggerLightning(){
    if(this.over||this.paused){ this.time.delayedCall(Phaser.Math.Between(15000,35000),()=>this.triggerLightning()); return; }
    const flash=this.add.rectangle(BASE_W/2,BASE_H/2,BASE_W,BASE_H,0xffffff,0).setDepth(999);
    this.tweens.add({targets:flash,alpha:{from:0,to:0.7},duration:40,yoyo:true,onComplete:()=>{
      this.time.delayedCall(60,()=>{ this.tweens.add({targets:flash,alpha:{from:0,to:0.3},duration:30,yoyo:true,onComplete:()=>flash.destroy()}); });
    }});
    Audio.thunder();
    this.time.delayedCall(Phaser.Math.Between(15000,35000),()=>this.triggerLightning());
  }

  /* ---------- spawning ---------- */
  pickEnemyType(){
    const w=this.roundScale.weights;
    const entries=Object.entries(w).filter(([,v])=>v>0);
    if(!entries.length) return 'undead';
    const total=entries.reduce((a,[,v])=>a+v,0);
    let r=Math.random()*total;
    for(const [k,v] of entries){ r-=v; if(r<=0) return k; }
    return entries[entries.length-1][0];
  }
  spawnEnemy(){
    if(this.enemies.filter(e=>e.alive).length>=this.maxConcurrent) return;
    let type=this.pickEnemyType();
    // villagers mixed in
    if(this.roundInnocentsSpawned<this.roundInnocentsCount && Math.random()<=this.roundScale.innocentRate){
      type='villager'; this.roundInnocentsSpawned++;
    }
    // max 1 bomber alive at a time
    if(type==='bomber' && this.enemies.some(e=>e.alive && e.type==='bomber')){
      const entries=Object.entries(this.roundScale.weights).filter(([k,v])=>k!=='bomber' && v>0);
      type=entries.length?entries[Math.floor(Math.random()*entries.length)][0]:'undead';
    }
    const sb=getSpawnBounds(this.stats.round);
    const x=Phaser.Math.Between(sb.enemyXMin,sb.enemyXMax);
    const y=(type==='bomber')?Phaser.Math.Between(sb.enemyYSuicideMin,sb.enemyYSuicideMax):Phaser.Math.Between(sb.enemyYMin,sb.enemyYMax);
    let e;
    if(type==='undead') e=new Undead(this,x,y);
    else if(type==='spitter') e=new Spitter(this,x,y);
    else if(type==='brute') e=new Brute(this,x,y);
    else if(type==='bomber') e=new Bomber(this,x,y);
    else if(type==='wraith') e=new Wraith(this,x,y);
    else e=new Enemy(this,x,y,'villager');
    e.innocent=(type==='villager');
    this.enemies.push(e);
    this.roundSpawned++;
  }
  resetRoundInnocents(){ this.roundInnocentsSpawned=0; this.roundInnocentsCount=this.roundScale.innocentsCount; }

  /* ---------- shooting ---------- */
  tryShoot(){
    if(this.over||this.paused) return;
    if(this.stats.reloading) return;
    if(this.stats.ammo<=0){ this.reload(); return; }
    this.stats.ammo--; this.stats.shotsFired++;
    Audio.shot();
    this.crossSpread=1;
    // muzzle flash
    this.muzzle.setFillStyle(0xffffff,0.25); this.time.delayedCall(60,()=>this.muzzle.setFillStyle(0xffffff,0));
    // spread offset
    const sp=this.crossSpread; const ox=Phaser.Math.Between(-12,12)*sp; const oy=Phaser.Math.Between(-12,12)*sp;
    const tx=this.mx+ox, ty=this.my+oy;
    // hit detection topmost
    let hit=null;
    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i]; if(!e.alive) continue;
      if(Math.abs(e.x-tx)<e.width/2+6 && Math.abs(e.y-ty)<e.height/2+6){ hit=e; break; }
    }
    // item click: any on-screen item
    if(!hit){
      for(const it of this.items){
        if(it.active && Math.abs(it.x-tx)<24 && Math.abs(it.y-ty)<24){
          this.collectItem(it); return;
        }
      }
    }
    if(hit){
      this.stats.shotsHit++;
      if(hit.innocent){
        this.killInnocent(hit);
      } else {
        const killed=hit.takeHit(this);
        if(killed){ this.addCombo(); }
      }
    } else {
      // miss breaks combo
      this.stats.combo=1; this.stats.comboCount=0; this.ui.refresh();
    }
    if(this.stats.ammo<=0) this.reload();
    this.ui.refresh();
  }
  addCombo(){
    this.stats.comboCount++;
    if(this.stats.comboCount>=8) this.stats.combo=4;
    else if(this.stats.comboCount>=5) this.stats.combo=3;
    else if(this.stats.comboCount>=3) this.stats.combo=2;
    else this.stats.combo=1;
  }
  reload(){
    if(this.stats.reloading||this.over||this.paused) return;
    if(this.stats.ammo>=this.stats.clipSize) return;
    this.stats.reloading=true; this.ui.refresh(); Audio.reload();
    const dur=Math.max(300, RELOAD_MS - (this.stats.upgrades.reload||0)*150);
    this.time.delayedCall(dur,()=>{ this.stats.ammo=this.stats.clipSize; this.stats.reloading=false; this.ui.refresh(); });
  }
  killInnocent(e){
    e.killed=true; e.alive=false;
    Audio.innocent();
    this.stats.score=Math.max(0,this.stats.score-50);
    this.stats.hp=Math.max(0,this.stats.hp-15);
    this.stats.innocentsKilled++;
    this.stats.combo=1; this.stats.comboCount=0;
    this.tweens.add({targets:e,alpha:0,angle:90,duration:300,onComplete:()=>e.destroy()});
    this.spawnBlood(e.x,e.y,true,0xcc0000);
    this.showInnocentWarning();
    this.flashDamage();
    if(this.stats.innocentsKilled>=5){ this.gameOver(); return; }
    if(this.stats.hp<=0) this.useContinue();
    this.ui.refresh();
  }
  showInnocentWarning(){
    const w=this.add.text(BASE_W/2,BASE_H/2-40,'ALDEÃO ABATIDO!',{fontSize:'48px',color:'#ff2020',fontStyle:'bold'}).setOrigin(0.5).setDepth(96);
    this.tweens.add({targets:w,scaleX:1.1,scaleY:1.1,duration:200,yoyo:true,repeat:1});
    this.time.delayedCall(2000,()=>w.destroy());
  }
  onEnemyKilled(e){
    this.stats.kills++;
    let gained=e.def.pts*this.stats.combo;
    // silver+ streak: kills multiply score (silver jerker active)
    if(this.stats.berserkUntil && this.time.now<this.stats.berserkUntil) gained+=e.def.pts*this.stats.combo;
    // double-points buff: 2x
    if(this.stats.doubleUntil && this.time.now<this.stats.doubleUntil) gained*=2;
    this.stats.score+=gained;
    const earned=Math.floor((this.stats.score-this.stats.lastContinueScore)/10000);
    if(earned>0){
      this.stats.continues+=earned;
      this.stats.lastContinueScore+=earned*10000;
      this.showContinueEarnedBanner(earned);
    }
    // earn coins per kill
    this.stats.coins += 2 + (e.def.pts>=300?3:0);
    this.spawnBlood(e.x,e.y,true);
    // monster drop: chance scales with round + drop upgrade
    const dropChance = Math.min(0.4, this.roundScale.dropChance + (this.stats.upgrades.dropch||0)*0.05);
    if(this.items.length<2 && Math.random()<dropChance){
      this.spawnItem(undefined, e.x, e.y);
    }
    this.ui.refresh();
  }
  showContinueEarnedBanner(earned){
    const b=this.add.text(BASE_W/2,BASE_H*0.15,'CONTINUE GANHO!',{fontSize:'56px',color:'#7fff7f',fontStyle:'bold'}).setOrigin(0.5).setDepth(95);
    const sub=this.add.text(BASE_W/2,BASE_H*0.15+50,'+'+earned+'  |  Total: '+this.stats.continues,{fontSize:'28px',color:'#fff'}).setOrigin(0.5).setDepth(95);
    this.tweens.add({targets:[b,sub],alpha:0,duration:400,delay:1800,onComplete:()=>{ b.destroy(); sub.destroy(); }});
    Audio.item();
  }

  /* ---------- items ---------- */
  spawnItem(kind, x, y){
    if(this.items.length>=2) return;
    const def=kind?ITEM_DEFS[kind]:null;
    if(!kind){
      // roll tier weighted by round
      const tw=this.roundScale.tierWeights;
      const tot=tw.common+tw.rare+tw.epic;
      let rr=Math.random()*tot, tier;
      if(rr<tw.common) tier='common'; else if(rr<tw.common+tw.rare) tier='rare'; else tier='epic';
      const pool=ITEM_POOL.filter(k=>ITEM_DEFS[k].tier===tier);
      kind=pool[Phaser.Math.Between(0,pool.length-1)];
    }
    const sb=getSpawnBounds(this.stats.round);
    if(x===undefined) x=Phaser.Math.Between(sb.itemXMin,sb.itemXMax);
    if(y===undefined) y=Phaser.Math.Between(sb.itemYMin,sb.itemYMax);
    this.items.push(new PowerUp(this,x,y,kind));
  }
  collectItem(item){
    if(!item||!item.active) return;
    Audio.item();
    const k=item.kind; const def=ITEM_DEFS[k];
    if(k==='med') this.stats.hp=Math.min(this.stats.maxHp,this.stats.hp+20);
    else if(k==='ammo') this.stats.ammo=this.stats.clipSize;
    else if(k==='shield') this.stats.shield=def.shield||3;
    else if(k==='slow'){ this.stats.slowUntil=this.time.now+def.duration; this.applySlow(true); this.time.delayedCall(def.duration,()=>this.applySlow(false)); }
    else if(k==='freeze') this.applyFreeze(def.duration);
    else if(k==='lifesteal') this.stats.lifestealShots=def.shots + this.stats.lifestealAdd;
    else if(k==='radar') this.stats.radarUntil=this.time.now+def.duration;
    else if(k==='doublepts') this.stats.doubleUntil=this.time.now+def.duration;
    else if(k==='berserker'){ this.stats.berserkUntil=this.time.now+def.duration; Audio.kill(); }
    else if(k==='nade') this.grenade();
    this.tweens.add({targets:item,scaleX:1.6,scaleY:1.6,alpha:0,duration:200,onComplete:()=>{ this.items=this.items.filter(i=>i!==item); item.destroy(); }});
    this.ui.refresh();
  }
  applySlow(on){
    this.enemies.forEach(e=>{ e.slowFactor=on?0.5:1; });
    if(on) Audio.slowOn(); else Audio.slowOff();
  }
  applyFreeze(duration){
    this.stats.freezeUntil=this.time.now+duration;
    this.enemies.forEach(e=>{ e.slowFactor=0.05; });
    // tint frozen enemies ice-blue
    this.enemies.forEach(e=>{ if(e.body){ e._freezeTint=true; e.body.setTint(0x88ddff); } });
    Audio.slowOn();
    this.time.delayedCall(duration,()=>{
      // restore: only un-freeze enemies still alive (slow factor may have been overridden by slow buff)
      const slowBuff = this.stats.slowUntil && this.time.now < this.stats.slowUntil;
      this.enemies.forEach(e=>{
        if(e.active && e._freezeTint){
          e._freezeTint=false;
          e.body && e.body.clearTint();
          e.slowFactor = slowBuff ? 0.5 : 1;
        }
      });
      Audio.slowOff();
    });
  }
  grenade(){
    Audio.kill();
    // die() already scores via onEnemyKilled; do not double-count
    this.enemies.forEach(e=>{ if(e.alive && !e.innocent){ e.die(this); } });
    this.cameras.main.shake(200,0.01);
    this.ui.refresh();
  }

  /* ---------- damage ---------- */
  takeDamage(dmg){
    if(this.over) return;
    if(this.stats.shield>0){ this.stats.shield--; this.ui.refresh(); return; }
    this.stats.hp=Math.max(0,this.stats.hp-dmg);
    Audio.hurt();
    this.flashDamage();
    this.stats.combo=1; this.stats.comboCount=0;
    if(dmg>=20) this.cameras.main.shake(150,0.008);
    if(this.stats.hp<=0) this.useContinue();
    this.ui.refresh();
  }
  useContinue(){
    if(this.stats.continues>0){
      this.stats.continues--;
      this.stats.hp=this.stats.maxHp;
      this.stats.ammo=this.stats.clipSize;
      this.stats.reloading=false;
      this.stats.shield=0;
      this.showContinueBanner();
    } else {
      this.gameOver();
    }
  }
  showContinueBanner(){
    const b=this.add.text(BASE_W/2,BASE_H*0.15,'CONTINUE USADO',{fontSize:'56px',color:'#ff4040',fontStyle:'bold'}).setOrigin(0.5).setDepth(95);
    const sub=this.add.text(BASE_W/2,BASE_H*0.15+50,'Continues restantes: '+this.stats.continues,{fontSize:'28px',color:'#fff'}).setOrigin(0.5).setDepth(95);
    this.tweens.add({targets:[b,sub],alpha:0,duration:400,delay:1800,onComplete:()=>{ b.destroy(); sub.destroy(); }});
    Audio.hurt();
    this.cameras.main.shake(300,0.015);
  }
  flashDamage(){
    this.tweens.add({targets:this.vignette,fillAlpha:0.5,duration:120,yoyo:true,onComplete:()=>this.vignette.setFillStyle(0xff0000,0)});
  }
  spawnBlood(x,y,big=false, color=0x44cc22){
    const n=big?18:8;
    for(let i=0;i<n;i++){
      const p=this.add.rectangle(x,y,4,4,color).setDepth(80);
      const a=Phaser.Math.FloatBetween(0,Math.PI*2), s=Phaser.Math.Between(40,160);
      this.tweens.add({targets:p,x:x+Math.cos(a)*s,y:y+Math.sin(a)*s,alpha:0,scaleX:0.3,scaleY:0.3,duration: Phaser.Math.Between(300,600),onComplete:()=>p.destroy()});
    }
  }

  /* ---------- pause ---------- */
  togglePause(){
    if(this.over) return;
    this.paused=!this.paused;
    if(this.paused){ this.scene.pause(); this.scene.launch('Pause'); this.scene.pause('UI'); }
    else { this.scene.resume(); this.scene.stop('Pause'); this.scene.resume('UI'); }
  }

  gameOver(){
    if(this.over) return; this.over=true;
    this.scene.stop('UI');
    this.scene.start('GameOver',{stats:this.stats});
  }
  victory(){
    if(this.over) return; this.over=true;
    this.scene.stop('UI');
    this.scene.start('GameOver',{stats:this.stats,win:true});
  }

  /* ---------- main loop ---------- */
  update(time,delta){
    if(this.paused||this.over) return;
    this.updateScenery(delta);
    // slow factor for new spawns handled per-enemy; existing handled via slowUntil check
    // spawn enemies
    this.spawnTimer-=delta;
    if(this.spawnTimer<=0 && this.roundSpawned<this.roundSpawnTotal){
      this.spawnEnemy();
      this.spawnTimer=this.spawnInterval+Phaser.Math.Between(-200,200);
    }
    // item spawn timer — up to 2 simultaneous, more frequent
    this.itemTimer-=delta;
    if(this.itemTimer<=0 && this.items.length<2){ this.spawnItem(); this.itemTimer=Phaser.Math.Between(12000,22000); }

    // update enemies (containers need manual preUpdate? Phaser Container has preUpdate)
    this.enemies=this.enemies.filter(e=>e.active);

    // round end check
    if(this.roundActive && this.roundSpawned>=this.roundSpawnTotal && this.enemies.length===0){
      this.nextRound();
    }

    // crosshair color
    this.updateCrosshair();
    // spread decay
    if(this.crossSpread>0){ this.crossSpread=Math.max(0,this.crossSpread-delta/300); }
    // radar overlay: highlight enemies with arrow markers
    this.updateRadar();
  }
  updateRadar(){
    if(!this.radarGfx){
      this.radarGfx=this.add.graphics().setDepth(98);
    }
    const g=this.radarGfx; g.clear();
    if(!(this.stats.radarUntil && this.time.now<this.stats.radarUntil)) return;
    // pulse alpha
    const pulse=0.5+0.5*Math.sin(this.time.now/150);
    this.enemies.forEach(e=>{
      if(!e.alive) return;
      // arrow from screen-edge toward enemy position
      const ex=e.x, ey=e.y-20;
      // distance from crosshair center
      const dx=ex-this.mx, dy=ey-this.my, dist=Math.hypot(dx,dy)||1;
      // draw small chevron 30px above enemy, pointing down
      const ax=ex, ay=ey-30 - pulse*4;
      g.lineStyle(3,0x40cc66,0.9);
      g.beginPath();
      g.moveTo(ax-6,ay-6); g.lineTo(ax,ay); g.lineTo(ax+6,ay-6);
      g.strokePath();
      // ring around enemy
      g.lineStyle(2,0x40cc66,0.5+pulse*0.4);
      g.strokeCircle(ex,ey,28+pulse*4);
    });
  }
  nextRound(){
    this.roundActive=false;
    // reward coins for completing round
    const bonus = 20 + this.stats.round * 5;
    this.stats.coins += bonus;
    const sub=this.add.text(BASE_W/2,BASE_H/2,'ROUND '+this.stats.round+' CONCLUÍDO\nPontos: '+this.stats.score+'\n+'+bonus+' moedas',{fontSize:'36px',color:'#7fff7f',align:'center',fontStyle:'bold'}).setOrigin(0.5).setDepth(95);
    this.time.delayedCall(2500,()=>{
      sub.destroy();
      this.stats.round++;
      this.resetRoundInnocents();
      // open shop between rounds
      this.scene.pause(); this.scene.pause('UI');
      this.scene.launch('Shop',{game:this});
    });
  }
  afterShop(){
    // called by ShopScene on continue
    this.roundScale=getRoundScale(this.stats.round);
    this.roundSpawnTotal=10+(this.stats.round-1)*3;
    this.roundSpawned=0; this.roundEscaped=0;
    // apply per-round start effects
    this.stats.shield=this.stats.startShield;
    this.roundBanner();
    this.scene.resume();
    this.roundActive=true;
    this.spawnTimer=500;
    this.ui && this.ui.refresh();
  }
  updateCrosshair(){
    let color=0xffffff;
    let onEnemy=false, onInnocent=false;
    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i]; if(!e.alive) continue;
      if(Math.abs(e.x-this.mx)<e.width/2+6 && Math.abs(e.y-this.my)<e.height/2+6){
        if(e.innocent) onInnocent=true; else onEnemy=true; break;
      }
    }
    if(onEnemy) color=0xff4040; else if(onInnocent) color=0x40ff40; else color=0xffffff;
    // hover any item — use its tier color
    for(const it of this.items){
      if(it.active && Math.abs(it.x-this.mx)<24 && Math.abs(it.y-this.my)<24){ color=ITEM_DEFS[it.kind].color; break; }
    }
    this.crossColor=color;
    const g=this.crosshair; g.clear();
    const spread=6+this.crossSpread*10;
    g.lineStyle(2,color,1);
    const x=this.mx,y=this.my;
    // circle
    g.strokeCircle(x,y,14+this.crossSpread*6);
    // cross arms with gap
    g.beginPath();
    g.moveTo(x-spread-12,y); g.lineTo(x-spread,y);
    g.moveTo(x+spread,y); g.lineTo(x+spread+12,y);
    g.moveTo(x,y-spread-12); g.lineTo(x,y-spread);
    g.moveTo(x,y+spread); g.lineTo(x,y+spread+12);
    g.strokePath();
    g.fillStyle(color,1); g.fillCircle(x,y,2);
  }
}

class UIScene extends Phaser.Scene {
  constructor(){ super('UI'); }
  init(data){ this.gameScene=data.game; }
  create(){
    this.s=this.gameScene.stats;
    // HP bar bg
    this.add.text(20,18,'VIDA',{fontSize:'16px',color:'#fff'});
    this.hpBg=this.add.rectangle(20,40,220,18,0x330000).setOrigin(0,0.5).setStrokeStyle(1,0xffffff,0.4);
    this.hpFill=this.add.rectangle(20,40,220,18,0xff2020).setOrigin(0,0.5);
    this.hpTxt=this.add.text(130,40,'100',{fontSize:'14px',color:'#fff'}).setOrigin(0.5);
    this.shieldTxt=this.add.text(250,40,'S:0',{fontSize:'16px',color:'#7fdfff'}).setOrigin(0,0.5);

    // score + combo
    this.scoreTxt=this.add.text(BASE_W-20,20,'0',{fontSize:'28px',color:'#ffdd40',fontStyle:'bold'}).setOrigin(1,0);
    this.comboTxt=this.add.text(BASE_W-20,52,'x1',{fontSize:'22px',color:'#ffffff'}).setOrigin(1,0);

    // ammo
    this.ammoTxt=this.add.text(20,BASE_H-30,'AMMO 12 / 12',{fontSize:'20px',color:'#fff'}).setOrigin(0,1);
    this.reloadTxt=this.add.text(20,BASE_H-55,'RECARREGANDO...',{fontSize:'18px',color:'#ff8030'}).setOrigin(0,1).setVisible(false);

    // round
    this.roundTxt=this.add.text(BASE_W/2,24,'ROUND 1',{fontSize:'24px',color:'#fff',fontStyle:'bold'}).setOrigin(0.5,0);
    // continues
    this.continueTxt=this.add.text(BASE_W/2,52,'CON x3',{fontSize:'18px',color:'#ff4040',fontStyle:'bold'}).setOrigin(0.5,0);
    // active buffs panel (bottom-left, above ammo)
    this.buffPanel=this.add.container(20,BASE_H-90).setDepth(50);
    this.buffSlots=[];
  }
  update(){
    const g=this.gameScene; if(!g||!g.time) return;
    const now=g.time.now;
    const active=[];
    if(g.stats.slowUntil>now) active.push({k:'⏱️',label:'LENTO',until:g.stats.slowUntil,max:6000,color:'#40c0ff'});
    if(g.stats.freezeUntil>now) active.push({k:'❄️',label:'CONGELADO',until:g.stats.freezeUntil,max:4000,color:'#88ddff'});
    if(g.stats.berserkUntil>now) active.push({k:'💢',label:'FÚRIA',until:g.stats.berserkUntil,max:8000,color:'#ff4040'});
    if(g.stats.doubleUntil>now) active.push({k:'✨',label:'2X PTS',until:g.stats.doubleUntil,max:10000,color:'#ffcc44'});
    if(g.stats.radarUntil>now) active.push({k:'📡',label:'RADAR',until:g.stats.radarUntil,max:6000,color:'#40cc66'});
    if(g.stats.lifestealShots>0) active.push({k:'🩸',label:'VAMPIRO x'+g.stats.lifestealShots,until:Infinity,max:1,color:'#cc4040',count:g.stats.lifestealShots});
    // rebuild only when the set of labels changes (cheap)
    const sig=active.map(a=>a.k+a.label).join('|');
    if(sig!==this._buffSig){
      this._buffSig=sig;
      this.buffSlots.forEach(s=>s.txt.destroy());
      this.buffSlots=[];
      active.forEach((a,i)=>{
        const txt=this.add.text(0,i*22,a.k+' '+a.label,{fontSize:'14px',color:'#fff',backgroundColor:'rgba(0,0,0,0.55)',padding:{x:4,y:2}}).setOrigin(0,0.5);
        this.buffPanel.add(txt);
        this.buffSlots.push({txt,max:a.until-a.max,until:a.until,color:a.color,count:a.count});
      });
    }
    // refresh timers + color blink near expiry
    this.buffSlots.forEach((s,i)=>{
      const remain=this.buffSlots[i].until-now;
      const total=this.buffSlots[i].until-this.buffSlots[i].max;
      const pct=Math.max(0,Math.min(1,remain/total));
      const blink=remain<1500?(Math.sin(now/80)+1)/2:1;
      this.buffSlots[i].txt.setAlpha(0.4+0.6*blink);
    });
  }
  refresh(){
    const s=this.s;
    const pct=Math.max(0,s.hp)/100;
    this.hpFill.scaleX=pct; this.hpFill.x=20;
    this.hpTxt.setText(Math.max(0,s.hp|0));
    this.shieldTxt.setText('S:'+s.shield);
    this.scoreTxt.setText(s.score);
    this.comboTxt.setText('x'+s.combo);
    this.comboTxt.setColor(s.combo>1?'#ff8030':'#ffffff');
    this.ammoTxt.setText('AMMO '+s.ammo+' / '+s.clipSize);
    this.reloadTxt.setVisible(s.reloading);
    this.roundTxt.setText('ROUND '+s.round);
    this.continueTxt.setText('CON x'+s.continues);
  }
}

/* ============================================================
   ShopScene — between-round upgrades
   ============================================================ */
const SHOP_UPGRADES = [
  { id:'maxhp',   icon:'❤️', name:'Vida Máxima +20',  desc:'HP máximo sobe 20 (cap 200)',   baseCost:120, scale:1.6, max:5 },
  { id:'clip',    icon:'🔫', name:'Pente +5',         desc:'Capacidade do pente +5',       baseCost:100, scale:1.7, max:6 },
  { id:'reload',  icon:'⏱️', name:'Recarga -150ms',   desc:'Recarrega 150ms mais rápido',  baseCost:90,  scale:1.7, max:3 },
  { id:'dropch',  icon:'🎲', name:'Drop +5%',         desc:'+5% chance de itens em kills', baseCost:80,  scale:1.6, max:5 },
  { id:'shield',  icon:'🛡️', name:'Escudo inicial +1',desc:'Começa rounds com +1 escudo',  baseCost:110, scale:1.7, max:4 },
  { id:'lifesteal',icon:'🩸',name:'Vampiro +2 tiros',  desc:'+2 tiros de cura por lifesteal',baseCost:140, scale:1.7, max:4 },
];
class ShopScene extends Phaser.Scene {
  constructor(){ super('Shop'); }
  init(data){ this.gameScene=data.game; this.stats=this.gameScene.stats; }
  create(){
    const W=BASE_W, H=BASE_H;
    this.add.rectangle(W/2,H/2,W,H,0x000000,0.78).setDepth(150);
    // title
    this.add.text(W/2,40,'LOJA — ROUND '+this.stats.round,{fontSize:'34px',color:'#ffcc44',fontStyle:'bold'}).setOrigin(0.5).setDepth(151);
    this.add.text(W/2,76,'Moedas: '+this.stats.coins,{fontSize:'22px',color:'#7fff7f',fontStyle:'bold'}).setOrigin(0.5).setDepth(151);
    this.selected=null;
    // render 3 random upgrade cards
    const available=SHOP_UPGRADES.filter(u=>{
      const lvl=this.stats.upgrades[u.id]||0;
      return lvl<u.max;
    });
    // pick 3 distinct (or all if fewer)
    const picks=[]; const pool=available.slice();
    while(picks.length<3 && pool.length>0){
      picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    }
    this.cards=[];
    const cardW=230, cardH=260, spacing=20;
    const totalW=picks.length*cardW+(picks.length-1)*spacing;
    const startX=W/2-totalW/2+cardW/2;
    picks.forEach((u,i)=>{
      const cx=startX+i*(cardW+spacing);
      const cy=H/2+10;
      const level=this.stats.upgrades[u.id]||0;
      const cost=Math.round(u.baseCost*Math.pow(u.scale,level));
      const affordable=this.stats.coins>=cost;
      const card=this.add.container(cx,cy).setDepth(151);
      const bg=this.add.rectangle(0,0,cardW,cardH,affordable?0x1a2840:0x2a1a1a,0.95).setStrokeStyle(2,affordable?0x40c0ff:0x664444);
      card.add(bg);
      card.add(this.add.text(0,-95,u.icon,{fontSize:'36px'}).setOrigin(0.5));
      card.add(this.add.text(0,-50,u.name,{fontSize:'16px',color:'#fff',fontStyle:'bold',align:'center',wordWrap:{width:cardW-20}}).setOrigin(0.5));
      card.add(this.add.text(0,0,u.desc,{fontSize:'12px',color:'#aabbcc',align:'center',wordWrap:{width:cardW-20}}).setOrigin(0.5));
      card.add(this.add.text(0,40,'Nível: '+level+'/'+u.max,{fontSize:'13px',color:'#8899aa'}).setOrigin(0.5));
      card.add(this.add.text(0,70,'Custo: '+cost,{fontSize:'18px',color:affordable?'#7fff7f':'#ff6060',fontStyle:'bold'}).setOrigin(0.5));
      // clickable
      bg.setInteractive({useHandCursor:true});
      bg.on('pointerover',()=>{ if(affordable) bg.setFillStyle(0x243660); });
      bg.on('pointerout',()=>{ if(affordable) bg.setFillStyle(0x1a2840); });
      bg.on('pointerdown',()=>{
        if(this.stats.coins<cost) return;
        this.buyUpgrade(u,cost);
      });
      this.cards.push({card,bg,upgrade:u,cost,affordable});
    });
    // continue button
    const cbtn=this.add.rectangle(W/2,H-60,260,50,0x222a33).setStrokeStyle(2,0xffffff).setInteractive({useHandCursor:true}).setDepth(151);
    const ctxt=this.add.text(W/2,H-60,'CONTINUAR ▶',{fontSize:'22px',color:'#fff',fontStyle:'bold'}).setOrigin(0.5).setDepth(151);
    cbtn.on('pointerover',()=>cbtn.setFillStyle(0x33404d));
    cbtn.on('pointerout',()=>cbtn.setFillStyle(0x222a33));
    cbtn.on('pointerdown',()=>this.continueGame());
    this.input.keyboard.on('keydown-SPACE',()=>this.continueGame());
    this.input.keyboard.on('keydown-ENTER',()=>this.continueGame());
  }
  buyUpgrade(u,cost){
    this.stats.coins-=cost;
    this.stats.upgrades[u.id]=(this.stats.upgrades[u.id]||0)+1;
    // apply permanent effects
    const lvl=this.stats.upgrades[u.id];
    if(u.id==='maxhp'){
      this.stats.maxHp=Math.min(200,100+lvl*20);
      this.stats.hp=this.stats.maxHp;
    } else if(u.id==='clip'){
      this.stats.clipSize=CLIP_SIZE+lvl*5;
    } else if(u.id==='shield'){
      this.stats.startShield=lvl;
    } else if(u.id==='lifesteal'){
      this.stats.lifestealAdd=lvl*2;
    }
    // refresh card visuals + coin count + restart scene so costs update
    this.scene.restart({game:this.gameScene});
  }
  continueGame(){
    this.scene.stop();
    this.gameScene.afterShop();
  }
}

  physics:{ default:'arcade' },
};
window.addEventListener('load',()=>{ window.game=new Phaser.Game(config); });
